<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Boogle</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e11d48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111827;
      --muted: #6b7280;
      --line: #d1d5db;
      --paper: #eef1f6;
      --surface: #f5f7fb;
      --signal: #e11d48;
      --phosphor: #fb7185;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --sans: "Source Sans 3", Georgia, sans-serif;
      --display: "Space Grotesk", var(--sans);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 70% 45% at 8% -8%, rgba(225, 29, 72, 0.12), transparent 55%),
        linear-gradient(180deg, var(--surface), var(--paper));
      -webkit-font-smoothing: antialiased;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: rgba(245, 247, 251, 0.88);
      backdrop-filter: blur(12px);
    }

    .nav-brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.04em;
      text-decoration: none;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
    }

    .nav-brand svg { width: 1.55rem; height: 1.55rem; }

    .nav a:not(.nav-brand) {
      color: var(--signal);
      font-weight: 600;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .panel { max-width: 28rem; width: 100%; }

    .code {
      font-family: var(--mono);
      font-size: 0.9rem;
      background: #111827;
      color: #e5e7eb;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1.5rem;
      border: 1px solid #1f2937;
    }

    .code .prompt { color: var(--phosphor); }
    .code .err { color: #fda4af; }

    h1 {
      font-family: var(--display);
      font-size: clamp(2rem, 6vw, 2.75rem);
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 0.65rem;
    }

    p { color: var(--muted); margin-bottom: 1.25rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.7rem 1.1rem;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--ink);
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: var(--signal);
      border-color: var(--signal);
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#111827"/>
        <ellipse cx="16" cy="18.4" rx="5.4" ry="6.6" fill="#fb7185"/>
        <ellipse cx="16" cy="10.4" rx="3.5" ry="3.2" fill="#fda4af"/>
        <circle cx="14.5" cy="9.9" r="0.95" fill="#111827"/>
        <circle cx="17.5" cy="9.9" r="0.95" fill="#111827"/>
        <path d="M14.1 8 C12.2 5.8 10.5 5.1 8.8 5.4" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M17.9 8 C19.8 5.8 21.5 5.1 23.2 5.4" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="8.8" cy="5.4" r="1.15" fill="#e11d48"/>
        <circle cx="23.2" cy="5.4" r="1.15" fill="#e11d48"/>
        <ellipse cx="10" cy="15" rx="4" ry="2.2" transform="rotate(-30 10 15)" fill="#fda4af" opacity=".55"/>
        <ellipse cx="22" cy="15" rx="4" ry="2.2" transform="rotate(30 22 15)" fill="#fda4af" opacity=".55"/>
        <path d="M11.2 16.6 7.2 14.8M11 19.4 6.8 19.6M11.4 22.2 7.4 24.4" fill="none" stroke="#e11d48" stroke-width="1.35" stroke-linecap="round"/>
        <path d="M20.8 16.6 24.8 14.8M21 19.4 25.2 19.6M20.6 22.2 24.6 24.4" fill="none" stroke="#e11d48" stroke-width="1.35" stroke-linecap="round"/>
        <ellipse cx="16" cy="17.4" rx="1.7" ry="3.4" fill="#fff" opacity=".2"/>
      </svg>
      Boogle
    </a>
    <a href="/">Home</a>
  </nav>
  <main>
    <div class="panel">
      <div class="code" aria-hidden="true">
        <div><span class="prompt">$</span> curl https://boogle.web.ap.it/missing</div>
        <div class="err">HTTP 404 — Not Found</div>
      </div>
      <h1>This exception is not tracked.</h1>
      <p>The page you asked for does not exist. Head back to the Boogle docs.</p>
      <a class="btn" href="/">Back to Boogle</a>
    </div>
  </main>
</body>
</html>
